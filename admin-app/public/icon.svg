<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1245"/>
      <stop offset="50%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Border Accent Glow -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="8"/>
  
  <!-- Central Emblem: Auditorium Dome & Pillars -->
  <g transform="translate(106, 110)">
    <!-- Roof / Pediment Triangle -->
    <path d="M 150 20 L 290 90 L 10 90 Z" fill="url(#primaryGrad)"/>
    <polygon points="150,38 270,90 30,90" fill="url(#goldGrad)" opacity="0.85"/>
    
    <!-- Architrave Beam -->
    <rect x="0" y="96" width="300" height="24" rx="6" fill="#FFFFFF"/>
    
    <!-- 4 Classic Ionic Pillars -->
    <rect x="25" y="128" width="32" height="120" rx="6" fill="url(#primaryGrad)"/>
    <rect x="95" y="128" width="32" height="120" rx="6" fill="url(#primaryGrad)"/>
    <rect x="173" y="128" width="32" height="120" rx="6" fill="url(#primaryGrad)"/>
    <rect x="243" y="128" width="32" height="120" rx="6" fill="url(#primaryGrad)"/>
    
    <!-- Pillar Highlights -->
    <line x1="41" y1="134" x2="41" y2="242" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
    <line x1="111" y1="134" x2="111" y2="242" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
    <line x1="189" y1="134" x2="189" y2="242" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
    <line x1="259" y1="134" x2="259" y2="242" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>

    <!-- Base Plinth -->
    <rect x="0" y="252" width="300" height="28" rx="8" fill="#FFFFFF"/>
    <rect x="15" y="284" width="270" height="14" rx="4" fill="url(#primaryGrad)"/>
    
    <!-- Geofence GPS Signal Waves -->
    <circle cx="150" cy="180" r="16" fill="#10B981"/>
    <circle cx="150" cy="180" r="30" fill="none" stroke="#10B981" stroke-width="4" opacity="0.7"/>
    <circle cx="150" cy="180" r="44" fill="none" stroke="#10B981" stroke-width="3" opacity="0.4"/>
  </g>
</svg>
