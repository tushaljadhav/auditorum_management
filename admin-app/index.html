<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kirti Admin | Auditorium Control</title>
    
    <!-- Cache Prevention Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA Primary Meta Tags -->
    <meta name="application-name" content="Kirti Admin PWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kirti Admin" />
    <meta name="description" content="Kirti M. Doongursee College Auditorium Admin Control & Operations PWA" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Watchdog & Self-Healing Script (Executes before React bundles) -->
    <script>
      (function() {
        window.__APP_MOUNTED__ = false;

        function purgeAndReload() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
          } catch(e) { console.error(e); }
          setTimeout(function() {
            var url = new URL(window.location.href);
            url.searchParams.set('v', Date.now());
            window.location.replace(url.href);
          }, 250);
        }

        window.__purgeAndReload = purgeAndReload;

        // Catch asset load failures (e.g. 404 on stale bundle chunk)
        window.addEventListener('error', function(e) {
          var target = e.target || e.srcElement;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            console.warn('[Watchdog] Script/asset failed to load:', target.src || target.href);
            var attempts = parseInt(sessionStorage.getItem('pwa_heal_attempts') || '0', 10);
            if (attempts < 2) {
              sessionStorage.setItem('pwa_heal_attempts', String(attempts + 1));
              purgeAndReload();
            } else {
              showFallbackUI('New update available. Please refresh to load.');
            }
          }
        }, true);

        // Watchdog timer: If React hasn't mounted in 4 seconds
        setTimeout(function() {
          if (!window.__APP_MOUNTED__) {
            var attempts = parseInt(sessionStorage.getItem('pwa_heal_attempts') || '0', 10);
            if (attempts < 1) {
              sessionStorage.setItem('pwa_heal_attempts', '1');
              purgeAndReload();
            } else {
              showFallbackUI('App loading is taking longer than usual.');
            }
          } else {
            sessionStorage.removeItem('pwa_heal_attempts');
          }
        }, 4000);

        function showFallbackUI(msg) {
          var fb = document.getElementById('pwa-fallback-action');
          var msgEl = document.getElementById('pwa-fallback-msg');
          var spinner = document.getElementById('pwa-spinner');
          if (fb) fb.style.display = 'block';
          if (msgEl) msgEl.innerText = msg;
          if (spinner) spinner.style.display = 'none';
        }
      })();
    </script>

    <style>
      #pwa-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F8FAFC;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #0F172A;
        z-index: 99999;
        padding: 24px;
        text-align: center;
      }
      .pwa-logo-box {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: #FFFFFF;
        box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.15), 0 8px 10px -6px rgba(79, 70, 229, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        overflow: hidden;
      }
      .pwa-logo-box img {
        width: 60px;
        height: 60px;
        object-fit: contain;
      }
      .pwa-title {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 6px 0;
        color: #0F172A;
      }
      .pwa-sub {
        font-size: 13px;
        font-weight: 500;
        color: #64748B;
        margin: 0 0 24px 0;
      }
      .pwa-spinner {
        width: 34px;
        height: 34px;
        border: 3.5px solid #E2E8F0;
        border-top-color: #4F46E5;
        border-radius: 50%;
        animation: pwaSpin 0.8s linear infinite;
      }
      @keyframes pwaSpin {
        to { transform: rotate(360deg); }
      }
      #pwa-fallback-action {
        display: none;
        margin-top: 16px;
      }
      .pwa-btn {
        background: #4F46E5;
        color: #FFFFFF;
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        outline: none;
      }
      .pwa-btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="pwa-preloader">
        <div class="pwa-logo-box">
          <img src="/Logo.png" alt="Kirti College" onerror="this.style.display='none'" />
        </div>
        <div class="pwa-title">Kirti Auditorium Admin</div>
        <div class="pwa-sub" id="pwa-fallback-msg">Loading dashboard & controls...</div>
        <div class="pwa-spinner" id="pwa-spinner"></div>
        <div id="pwa-fallback-action">
          <button class="pwa-btn" onclick="window.__purgeAndReload()">
            Clear Cache & Open App
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
