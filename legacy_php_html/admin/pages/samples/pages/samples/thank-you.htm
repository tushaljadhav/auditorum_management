<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Thank You for Booking | Kirti M. Doongursee College of Arts, Science and Commerce</title>
    <link rel="stylesheet" href="../../assets/vendors/mdi/css/materialdesignicons.min.css" />
    <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="shortcut icon" href="../../assets/images/favicon.png" />
    
    <style>
      .thank-you-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      .thank-you-box {
        padding: 40px;
        background-color: #f9f9f9;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 80%;
        max-width: 500px;
      }
      .thank-you-box h1 {
        font-size: 36px;
        color: #28a745;
        margin-bottom: 20px;
      }
      .thank-you-box p {
        font-size: 18px;
        margin-bottom: 10px;
      }
      .thank-you-box a {
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
        font-size: 18px;
      }
      .thank-you-box .go-back-btn {
        margin-top: 30px;
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .thank-you-box .go-back-btn:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="thank-you-container">
            <div class="thank-you-box">
              <h1>Thank You for Your Booking!</h1>
              <p>Your booking request has been successfully submitted.</p>
              <p>You will receive all the details of your booking on your registered mobile number and email address shortly.</p>
              <p>If you have any queries, feel free to <a href="mailto:info@kmdcollege.com">contact us</a>.</p>
              <button class="go-back-btn" onclick="window.history.back();">Go Back to Booking</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
