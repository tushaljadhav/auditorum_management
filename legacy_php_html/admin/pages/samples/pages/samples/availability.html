<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Availability | Kirti M. Doongursee College of Arts, Science and Commerce</title>
    <link rel="stylesheet" href="../../assets/vendors/mdi/css/materialdesignicons.min.css" />
    <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="shortcut icon" href="../../assets/images/favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .brand-logo img {
        max-width: 100%;
        height: auto;
      }
      .auth-form-light h4 {
        margin-top: 20px;
        text-align: center;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-radius: 50%;
        border-top: 4px solid #3498db;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: none;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo text-center">
                  <img src="C:/tushaldemo/src/pages/samples/Logo.png" alt="Logo" />
                </div>
                <h4>Auditorium Book</h4>
                <form id="bookingForm" class="pt-3">
                  <div class="form-group">
                    <label for="dateInput">Date</label>
                    <input required type="date" class="form-control form-control-lg" id="dateInput" placeholder="Select Date" />
                    <div id="dateError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="startTimeInput">Start Time</label>
                    <input required type="time" class="form-control form-control-lg" id="startTimeInput" />
                    <div id="startTimeError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="endTimeInput">End Time</label>
                    <input required type="time" class="form-control form-control-lg" id="endTimeInput" />
                    <div id="endTimeError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="departmentInput">Department</label>
                    <select required class="form-control form-control-lg" id="departmentInput">
                      <option value="">Select Department</option>
                      <option value="IT">IT</option>
                      <option value="CSE">CSE</option>
                      <option value="ECE">ECE</option>
                      <option value="Mechanical">Mechanical</option>
                    </select>
                    <div id="departmentError" class="error-message"></div>
                  </div>
                  <div class="mt-3 d-grid gap-2">
                    <button type="button" class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn" id="checkAvailabilityButton" onclick="checkAvailability()">
                      Check Availability
                      <span class="loader" id="loader"></span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var bookedSlots = [
        { date: "2024-12-28", times: ["14:00-16:00", "17:00-20:00"] },
        { date: "2024-12-29", times: ["08:00-10:00", "10:00-12:00"] },
        { date: "2024-12-30", times: ["13:00-15:00"] },
      ];
    
      function isSlotAvailable(selectedDate, selectedStartTime, selectedEndTime) {
        var booking = bookedSlots.find((slot) => slot.date === selectedDate);
        if (!booking) return true;
    
        for (var timeRange of booking.times) {
          var [bookedStart, bookedEnd] = timeRange.split("-");
          if (
            (selectedStartTime >= bookedStart && selectedStartTime < bookedEnd) ||
            (selectedEndTime > bookedStart && selectedEndTime <= bookedEnd) ||
            (selectedStartTime <= bookedStart && selectedEndTime >= bookedEnd)
          ) {
            return false;
          }
        }
        return true;
      }
    
      function getAvailableTimeSlots(selectedDate) {
        var allTimeSlots = ["08:00-10:00", "10:00-12:00", "14:00-16:00", "17:00-20:00"];
        var booking = bookedSlots.find((slot) => slot.date === selectedDate);
    
        if (!booking) {
          return allTimeSlots; // All slots are available if no bookings exist for the date
        }
    
        return allTimeSlots.filter(
          (slot) => !booking.times.includes(slot)
        );
      }
    
      function checkAvailability() {
        var loader = document.getElementById("loader");
        loader.style.display = "inline-block";
    
        setTimeout(() => {
          var dateInput = document.getElementById("dateInput").value;
          var startTimeInput = document.getElementById("startTimeInput").value;
          var endTimeInput = document.getElementById("endTimeInput").value;
          var departmentInput = document.getElementById("departmentInput").value;
    
          var dateError = document.getElementById("dateError");
          var startTimeError = document.getElementById("startTimeError");
          var endTimeError = document.getElementById("endTimeError");
          var departmentError = document.getElementById("departmentError");
    
          dateError.textContent = "";
          startTimeError.textContent = "";
          endTimeError.textContent = "";
          departmentError.textContent = "";
    
          var isValid = true;
    
          if (!dateInput) {
            dateError.textContent = "Please select a date.";
            isValid = false;
          }
          if (!startTimeInput) {
            startTimeError.textContent = "Please select a start time.";
            isValid = false;
          }
          if (!endTimeInput) {
            endTimeError.textContent = "Please select an end time.";
            isValid = false;
          } else if (endTimeInput <= startTimeInput) {
            endTimeError.textContent = "End time must be after start time.";
            isValid = false;
          }
          if (!departmentInput) {
            departmentError.textContent = "Please select a department.";
            isValid = false;
          }
    
          if (isValid) {
            if (!isSlotAvailable(dateInput, startTimeInput, endTimeInput)) {
              var booking = bookedSlots.find((slot) => slot.date === dateInput);
              var bookedTimes = booking ? booking.times.join(", ") : "None";
              var availableSlots = getAvailableTimeSlots(dateInput);
    
              Swal.fire({
                icon: "info",
                title: "Unavailable",
                html: `
                  <p>This time slot is already booked:</p>
                  <p><strong>${bookedTimes}</strong></p>
                  ${availableSlots.length > 0
                    ? `<p>Available time slots: ${availableSlots.join(", ")}</p>`
                    : `<p>No alternative time slots are available for this date.</p>`}
                `,
              });
            } else {
              Swal.fire({
                title: "Confirm Booking?",
                text: "Great! The selected time slot is available. Do you want to proceed with the booking?",
                icon: "question",
                showCancelButton: true,
                confirmButtonText: "Yes",
                cancelButtonText: "No",
              }).then((result) => {
                  if (result.isConfirmed) {
                    var booking = bookedSlots.find((slot) => slot.date === dateInput);
                    if (!booking) {
                      bookedSlots.push({
                        date: dateInput,
                        times: [`${startTimeInput}-${endTimeInput}`],
                      });
                    } else {
                      booking.times.push(`${startTimeInput}-${endTimeInput}`);
                    }
                    window.location.href = "add-auditorium.html";
                  }
                });

            }
          }
          loader.style.display = "none";
        }, 1500);
      }
    </script>
    
  </body>
</html>
