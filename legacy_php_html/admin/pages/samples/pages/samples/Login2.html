<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purple Admin</title>
  <link rel="stylesheet" href="../../assets/vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="../../assets/vendors/ti-icons/css/themify-icons.css">
  <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="../../assets/vendors/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="shortcut icon" href="../../assets/images/favicon.png" />
  <style>
    /* General Styling */
    body {
      font-family: Arial, sans-serif;
    }

    .auth-form-light {
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .time-slot-container {
      position: relative;
    }

    .time-slot {
      display: none;
      position: absolute;
      background-color: #fff;
      border: 1px solid #ddd;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
      z-index: 1;
    }

    .time-slot div {
      padding: 8px;
      cursor: pointer;
    }

    .time-slot div:hover {
      background-color: #f1f1f1;
    }

    .time-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .time-container div {
      flex: 1;
      min-width: 48%;
    }

    .error-message {
      color: red;
      font-size: 12px;
    }

    /* Responsive Styling */
    @media screen and (max-width: 768px) {
      .auth-form-light {
        padding: 20px;
      }

      .time-container {
        flex-direction: column;
        gap: 5px;
      }

      .time-container div {
        width: 100%;
        min-width: unset;
      }

      .form-control {
        font-size: 16px;
        padding: 10px;
      }

      .btn {
        padding: 15px;
        font-size: 16px;
      }

      label {
        font-size: 14px;
        margin-bottom: 5px;
      }
    }

    @media screen and (max-width: 480px) {
      .auth-form-light {
        margin: 10px;
      }

      h4, h6 {
        font-size: 18px;
        text-align: center;
      }

      .btn {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-center auth">
        <div class="row flex-grow">
          <div class="col-lg-8 mx-auto">
            <div class="auth-form-light text-left p-5">
              <div class="brand-logo text-center">
                <img src="C:/tushaldemo/src/pages/samples/Logo.png" alt="Logo" />
              </div>
              <h4>Auditorium Booking System</h4>
              <h6 class="font-weight-light">Check Availability</h6>
              <form id="booking-form" class="pt-3">
                <div class="form-group">
                  <label for="venue">Venue</label>
                  <select id="venue" class="form-control form-control-lg" required>
                    <option value="0.8">0.8</option>
                    <option value="2.8">2.8</option>
                    <option value="3.11">3.11</option>
                    <option value="JSKB Hall">JSKB Hall</option>
                    <option value="NMITD Hall">NMITD Hall</option>
                    <option value="JSKB Board Room">JSKB Board Room</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="date">Date of Event</label>
                  <input type="date" id="date" class="form-control form-control-lg" required>
                </div>

                <div class="form-group">
                  <label>Time Slot</label>
                  <div class="time-container">
                    <div class="time-slot-container">
                      <label for="start-time">Start Time</label>
                      <input type="text" id="start-time" class="form-control" placeholder="Start Time" readonly required>
                      <div id="start-time-slot" class="time-slot"></div>
                    </div>
                    <div class="time-slot-container">
                      <label for="end-time">End Time</label>
                      <input type="text" id="end-time" class="form-control" placeholder="End Time" readonly required>
                      <div id="end-time-slot" class="time-slot"></div>
                    </div>
                  </div>
                </div>

                <div class="form-group">
                  <label for="audience">Audience (Count)</label>
                  <input type="number" id="audience" class="form-control form-control-lg" min="1" required>
                </div>

                <div class="mt-3 d-grid gap-2">
                  <button type="submit" class="btn btn-gradient-primary btn-lg font-weight-medium auth-form-btn" id="submitBtn">
                    Check Availability
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


<script>
  const timeSlots = [
    "06:00 AM", "06:30 AM", "07:00 AM", "07:30 AM",
    "08:00 AM", "08:30 AM", "09:00 AM", "09:30 AM",
    "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM",
    "12:00 PM", "12:30 PM", "01:00 PM", "01:30 PM",
    "02:00 PM", "02:30 PM", "03:00 PM", "03:30 PM",
    "04:00 PM", "04:30 PM", "05:00 PM", "05:30 PM",
    "06:00 PM", "06:30 PM", "07:00 PM", "07:30 PM",
    "08:00 PM", "08:30 PM", "09:00 PM", "09:30 PM",
    "10:00 PM"
  ];

  const bookedSlots = []; // Array to store booked slots

  function createTimeSlotPicker(id, inputId) {
    const timeSlotContainer = document.getElementById(id);
    const inputField = document.getElementById(inputId);

    inputField.addEventListener("click", () => {
      timeSlotContainer.style.display = "block";
    });

    timeSlots.forEach(slot => {
      const slotDiv = document.createElement("div");
      slotDiv.textContent = slot;
      slotDiv.addEventListener("click", () => {
        inputField.value = slot;
        timeSlotContainer.style.display = "none";
      });
      timeSlotContainer.appendChild(slotDiv);
    });

    document.addEventListener("click", (e) => {
      if (!timeSlotContainer.contains(e.target) && e.target !== inputField) {
        timeSlotContainer.style.display = "none";
      }
    });
  }

  createTimeSlotPicker("start-time-slot", "start-time");
  createTimeSlotPicker("end-time-slot", "end-time");

  // Helper function to convert time to a comparable number
  function timeToNumber(timeStr) {
    const [time, modifier] = timeStr.split(" ");
    let [hours, minutes] = time.split(":").map(Number);

    if (modifier === "PM" && hours !== 12) hours += 12;
    if (modifier === "AM" && hours === 12) hours = 0;

    return hours * 60 + minutes; // Return total minutes from midnight
  }

  // Function to check if two time ranges overlap
  function isOverlapping(newStart, newEnd, existingStart, existingEnd) {
    return (
      (newStart >= existingStart && newStart < existingEnd) || // Starts within an existing booking
      (newEnd > existingStart && newEnd <= existingEnd) || // Ends within an existing booking
      (newStart <= existingStart && newEnd >= existingEnd) // Completely overlaps an existing booking
    );
  }

  document.getElementById("booking-form").addEventListener("submit", function(event) {
    event.preventDefault(); // Prevent form's default submission

    const date = document.getElementById("date").value;
    const startTime = document.getElementById("start-time").value;
    const endTime = document.getElementById("end-time").value;

    if (!date || !startTime || !endTime) {
      alert("Please fill out the date and time slots before submitting.");
      return;
    }

    const newStart = timeToNumber(startTime);
    const newEnd = timeToNumber(endTime);

    if (newStart >= newEnd) {
      alert("End time must be after start time.");
      return;
    }

    const isConflict = bookedSlots.some(slot => {
      const [slotDate, slotTimes] = slot.split(" | ");
      const [slotStart, slotEnd] = slotTimes.split(" - ").map(timeToNumber);

      return date === slotDate && isOverlapping(newStart, newEnd, slotStart, slotEnd);
    });

    if (isConflict) {
      alert("This time slot overlaps with an existing booking. Please choose a different time.");
    } else {
      bookedSlots.push(`${date} | ${startTime} - ${endTime}`);
      alert("Slot successfully booked!");

      // Optional: log booked slots for debugging
      console.log("Booked Slots:", bookedSlots);

      // Optionally clear form fields after successful booking
      document.getElementById("booking-form").reset();
    }
  });
</script>

    
  </body>
</html>
