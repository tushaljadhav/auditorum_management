<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #89f7fe, #66a6ff);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .card {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 500px;
        padding: 40px 20px;
        margin: 20px;
      }

      .card-title {
        font-size: 1.5em;
        margin-bottom: 10px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-control {
        width: 95%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }

      .btn {
        padding: 10px 20px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        margin-top: 20px;
        width: 100%;
        background: linear-gradient(to right, #da22ff, #9733ee);
        color: #fff;
      }

      /* Modal styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .modal-content {
        background-color: #fefefe;
        margin: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 100%;
        max-width: 500px;
        border-radius: 10px;
      }
      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
      }
      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }
      .modal-footer {
        display: flex;
        justify-content: space-between;
      }
      .modal-footer .btn {
        margin: 0 5px;
      }

      /* Responsive styles */
      @media (min-width: 768px) {
        .card {
          padding: 50px;
        }
        .btn {
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px 10px;
        }
        .form-control {
          padding: 8px;
        }
        .btn {
          padding: 10px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h4 class="card-title">Default Form</h4>
      <form id="registrationForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Username"
            required
          />
          <small id="usernameError" style="color: red; display: none;">Username is required</small>
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Email"
            required
          />
          <small id="emailError" style="color: red; display: none;">Please enter a valid email</small>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            class="form-control"
            id="phone"
            placeholder="Enter your phone number"
            pattern="[0-9]{10}" 
            required
           />
          <small id="phoneError" style="color: red; display: none;">Please enter a valid 10-digit phone number</small>
        </div>
        <div class="form-group">
          <label for="exampleInputCity1">Department</label>
          <input
            type="text"
            class="form-control"
            id="exampleInputCity1"
            placeholder="Department name"
            required
          />
          <small id="departmentError" style="color: red; display: none;">Department name is required</small>
        </div>
        <div class="form-group">
          <label for="exampleTextarea1">Textarea</label>
          <textarea
            class="form-control"
            id="exampleTextarea1"
            rows="4"
            placeholder="Why do you want the auditorium? For what purpose?"
            required
          ></textarea>
          <small id="textareaError" style="color: red; display: none;">Please provide a reason</small>
        </div>
        <button type="submit" class="btn btn-gradient-primary">Submit</button>
      </form>
    </div>

    <!-- Modal -->
    <div class="modal" id="successModal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h5>Thank You!</h5>
        <p>Your details have been submitted. The auditorium has been booked successfully.</p>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="newBooking()"
          >
            New Booking
          </button>
          <button
            type="button"
            class="btn btn-primary"
            onclick="closeModal()"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script>
     document.getElementById('registrationForm').addEventListener('submit', function(e) {
  // Helper function for validation
  function validateField(field, errorElement, condition, message) {
    if (condition) {
      errorElement.textContent = message;
      errorElement.style.display = 'block';
      return false;
    } else {
      errorElement.style.display = 'none';
      return true;
    }
  }

  // Initialize validation flags
  let isValid = true;

  // Username validation
  const username = document.getElementById('username');
  const usernameError = document.getElementById('usernameError');
  isValid &= validateField(
    username,
    usernameError,
    username.value.trim() === '',
    'Username is required'
  );

  // Email validation
  const email = document.getElementById('email');
  const emailError = document.getElementById('emailError');
  isValid &= validateField(
    email,
    emailError,
    email.validity.typeMismatch || email.value.trim() === '',
    'Please enter a valid email'
  );

  // Phone validation
  const phone = document.getElementById('phone');
  const phoneError = document.getElementById('phoneError');
  isValid &= validateField(
    phone,
    phoneError,
    phone.value.trim() === '' || !phone.value.match(/^\d{10}$/),
    'Please enter a valid 10-digit phone number'
  );

  // Department validation
  const department = document.getElementById('exampleInputCity1');
  const departmentError = document.getElementById('departmentError');
  isValid &= validateField(
    department,
    departmentError,
    department.value.trim() === '',
    'Department name is required'
  );

  // Textarea validation
  const textarea = document.getElementById('exampleTextarea1');
  const textareaError = document.getElementById('textareaError');
  isValid &= validateField(
    textarea,
    textareaError,
    textarea.value.trim() === '',
    'Please provide a reason'
  );

  // Prevent form submission if validation fails
  if (isValid) {
    e.preventDefault();
    // Show success modal
    document.getElementById('successModal').style.display = 'flex';
  }
});

function closeModal() {
  document.getElementById('successModal').style.display = 'none';
  // Reset the form
  document.getElementById('registrationForm').reset();
}

function newBooking() {
  // Redirect to availability.html
  window.location.href = 'availability.html';
}

// Close the modal when clicking outside of it
window.onclick = function(event) {
  var modal = document.getElementById("successModal");
  if (event.target == modal) {
    closeModal();
  }
};

    </script>
  </body>
</html>
