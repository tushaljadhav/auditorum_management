<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Availability</title>
    <!-- plugins:css -->
    <link
      rel="stylesheet"
      href="../../assets/vendors/mdi/css/materialdesignicons.min.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/vendors/ti-icons/css/themify-icons.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/vendors/css/vendor.bundle.base.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/vendors/font-awesome/css/font-awesome.min.css"
    />
    <!-- endinject -->
    <!-- Layout styles -->
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <!-- End layout styles -->
    <link rel="shortcut icon" href="../../assets/images/favicon.png" />
    <style>
      .brand-logo img {
        max-width: 100%;
        height: auto;
      }
      .auth-form-light h4 {
        margin-top: 20px;
        text-align: center;
      }
      option,
      select {
        color: black;
      }
      .auth .auth-form-light select {
        color: black;
        padding-left: 25px;
      }

      /* Modal styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .modal-content {
        background-color: #fefefe;
        margin: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 100%;
        max-width: 500px;
        border-radius: 10px;
      }
      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
      }
      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }
      .modal-footer {
        display: flex;
        justify-content: space-between;
      }
      .modal-footer .btn {
        margin: 0 5px;
      }

      /* Error message styles */
      .error-message {
        color: red;
        font-size: 0.875rem;
        margin-top: 5px;
      }

      /* Responsive styles */
      @media (max-width: 768px) {
        .auth-form-light {
          padding: 20px;
        }
        .modal-content {
          width: 90%;
          max-width: 400px;
        }
      }

      @media (max-width: 576px) {
        .auth-form-light {
          padding: 15px;
        }
        .modal-content {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo text-center">
                  <img
                    src="C:\tushaldemo\src\pages\samples\Logo.png"
                    alt="Logo"
                  />
                </div>
                <h4>Auditorium Book</h4>
                <form id="bookingForm" class="pt-3">
                  <div class="form-group">
                    <label for="dateInput">Date</label>
                    <input
                      required
                      type="date"
                      class="form-control form-control-lg"
                      id="dateInput"
                      placeholder="Select Date"
                    />
                    <div id="dateError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="timeInput">Time</label>
                    <select
                      required
                      class="form-control form-control-lg"
                      id="timeInput"
                    >
                      <option value="">Select Time</option>
                      <option value="08:00">08:00 AM</option>
                      <option value="09:00">09:00 AM</option>
                      <option value="10:00">10:00 AM</option>
                      <option value="11:00">11:00 AM</option>
                      <option value="12:00">12:00 PM</option>
                      <option value="13:00">01:00 PM</option>
                      <option value="14:00">02:00 PM</option>
                      <option value="15:00">03:00 PM</option>
                      <option value="16:00">04:00 PM</option>
                      <option value="17:00">05:00 PM</option>
                      <option value="18:00">06:00 PM</option>
                    </select>
                    <div id="timeError" class="error-message"></div>
                  </div>
                  <div class="mt-3 d-grid gap-2">
                    <button
                      type="button"
                      class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn"
                      onclick="showModal()"
                    >
                      Check Availability
                    </button>
                  </div>
                  <div
                    class="my-2 d-flex justify-content-between align-items-center"
                  >
                    <!-- Add any additional content here -->
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <!-- content-wrapper ends -->
      </div>
      <!-- page-body-wrapper ends -->
    </div>
    <!-- container-scroller -->

    <!-- Modal -->
    <div class="modal" id="availabilityModal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h5>Availability</h5>
        <p id="modalMessage">
          <!-- This will be updated dynamically -->
        </p>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="closeModal()"
          >
            Close
          </button>
          <button
            type="button"
            class="btn btn-primary"
            id="confirmButton"
            onclick="confirmBooking()"
          >
            Yes
          </button>
        </div>
      </div>
    </div>

    <script>
      // Array to hold booked time slots
      var bookedSlots = [];
      var selectedDate, selectedTime;

      function showModal() {
        var dateInput = document.getElementById("dateInput").value;
        var timeInput = document.getElementById("timeInput").value;
        var dateError = document.getElementById("dateError");
        var timeError = document.getElementById("timeError");

        // Clear previous error messages
        dateError.textContent = "";
        timeError.textContent = "";

        // Basic validation
        var isValid = true;
        if (!dateInput) {
          dateError.textContent = "Please select a date.";
          isValid = false;
        }
        if (!timeInput) {
          timeError.textContent = "Please select a time.";
          isValid = false;
        }

        if (isValid) {
          // Store selected values
          selectedDate = dateInput;
          selectedTime = timeInput;

          // Prepare and show modal
          var key = `${selectedDate}-${selectedTime}`;
          var modalMessage = document.getElementById("modalMessage");
          var confirmButton = document.getElementById("confirmButton");

          if (bookedSlots.includes(key)) {
            modalMessage.textContent =
              "This time slot is already booked. Please choose another time.";
            confirmButton.style.display = "none";
          } else {
            modalMessage.textContent =
              "Availability checked successfully! Do you want to proceed with this booking?";
            confirmButton.style.display = "inline";
          }

          document.getElementById("availabilityModal").style.display = "flex";
        }
      }

      function closeModal() {
        document.getElementById("availabilityModal").style.display = "none";
      }

      function confirmBooking() {
        var key = `${selectedDate}-${selectedTime}`;

        // Add the time slot to booked slots
        bookedSlots.push(key);

        closeModal(); // Close the modal after confirming the booking

        // Redirect to the form page
        window.location.href = "formpage.html"; // Replace with your form page URL
      }

      // Close the modal when clicking outside of it
      window.onclick = function (event) {
        var modal = document.getElementById("availabilityModal");
        if (event.target == modal) {
          modal.style.display = "none";
        }
      };
    </script>
  </body>
</html>
