<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Purple Admin</title>
    <!-- Plugins: CSS -->
    <link rel="stylesheet" href="../../assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="../../assets/vendors/ti-icons/css/themify-icons.css">
    <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="../../assets/vendors/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="shortcut icon" href="../../assets/images/favicon.png" />
    <style>
      .time-slot-container {
        position: relative;
      }
      .time-slot {
        display: none;
        position: absolute;
        background-color: #fff;
        border: 1px solid #ddd;
        max-height: 200px;
        overflow-y: auto;
        width: 100%;
        z-index: 1;
      }
      .time-slot div {
        padding: 8px;
        cursor: pointer;
      }
      .time-slot div:hover {
        background-color: #f1f1f1;
      }
      .time-container {
        display: flex;
        gap: 10px;
      }
      .time-container div {
        flex: 1;
      }
      .error-message {
        color: red;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-8 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo text-center">
                  <img src="C:/tushaldemo/src/pages/samples/Logo.png" alt="Logo" />
                </div>
                <h4>Auditorium Booking System</h4>
                <h6 class="font-weight-light">Fill in the details to book.</h6>
                <form id="booking-form" class="pt-3">
                  <div class="form-group">
                    <label for="title">Title of the Event</label>
                    <input type="text" id="title" class="form-control form-control-lg" required>
                  </div>
                  <div class="form-group">
                    <label for="department">Organized By (Department)</label>
                    <input type="text" id="department" class="form-control form-control-lg" required>
                  </div>
                  <div class="form-group">
                    <label for="contact">Person Name</label>
                    <input type="text" id="contact" class="form-control form-control-lg" required>
                  </div>
                  <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control form-control-lg" required>
                  </div>
                  <div class="form-group">
                    <label for="phone" class="phone-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-control form-control-lg" placeholder="Enter your phone number" required>
                    <div id="error-message" class="error-message" style="display: none;">Please enter a valid 10-digit phone number.</div>
                  </div>
                  <div class="mt-3 d-grid gap-2">
                    <button type="submit" class="btn btn-gradient-primary btn-lg font-weight-medium auth-form-btn" id="submitBtn">
                      Submit
                    </button>
                  </div>
                </form>
                <script src="form.js"></script>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>

      document.getElementById("booking-form").addEventListener("submit", function (event) {
  event.preventDefault(); // Prevent form from reloading the page

  // Get form data
  const title = document.getElementById("title").value;
  const department = document.getElementById("department").value;
  const contact = document.getElementById("contact").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value;

  // Save data to localStorage
  const eventData = JSON.parse(localStorage.getItem("events")) || [];
  eventData.push({ title, department, contact, email, phone });
  localStorage.setItem("events", JSON.stringify(eventData));

  // // Clear form
  // this.reset();

  // // Redirect to the table page
  // window.location.href = "table.html";
});



      // Phone number validation function
      function validatePhone() {
        const phone = document.getElementById("phone").value;
        const errorMessage = document.getElementById("error-message");

        if (phone.length !== 10 || isNaN(phone)) {
          errorMessage.style.display = "block"; // Show the error message
          return false; // Validation failed
        } else {
          errorMessage.style.display = "none"; // Hide the error message
          return true; // Validation successful
        }
      }

      document.getElementById("booking-form").addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent form's default submission

        if (validatePhone()) {
          window.location.href = 'Login2.html'; // Redirect on successful validation
        }
      });
       

      
    </script>
  </body>
</html>
