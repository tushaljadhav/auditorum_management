<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Availability</title>
    <!-- plugins:css -->
    <link
      rel="stylesheet"
      href="../../assets/vendors/mdi/css/materialdesignicons.min.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/vendors/ti-icons/css/themify-icons.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/vendors/css/vendor.bundle.base.css"
    />
    <link
      rel="stylesheet"
      href="../../assets/vendors/font-awesome/css/font-awesome.min.css"
    />
    <!-- endinject -->
    <!-- Layout styles -->
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <!-- End layout styles -->
    <link rel="shortcut icon" href="../../assets/images/favicon.png" />
    <style>
      .brand-logo img {
        max-width: 100%;
        height: auto;
      }
      .auth-form-light h4 {
        margin-top: 20px;
        text-align: center;
      }
      option,
      select {
        color: black;
      }
      .auth .auth-form-light select {
        color: black;
        padding-left: 25px;
      }

      /* Modal styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .modal-content {
        background-color: #fefefe;
        margin: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 100%;
        max-width: 500px;
        border-radius: 10px;
      }
      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
      }
      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }
      .modal-footer {
        display: flex;
        justify-content: space-between;
      }
      .modal-footer .btn {
        margin: 0 5px;
      }

      /* Error message styles */
      .error-message {
        color: red;
        font-size: 0.875rem;
        margin-top: 5px;
      }

      /* Responsive styles */
      @media (max-width: 768px) {
        .auth-form-light {
          padding: 20px;
        }
        .modal-content {
          width: 90%;
          max-width: 400px;
        }
      }

      @media (max-width: 576px) {
        .auth-form-light {
          padding: 15px;
           

        }
        .modal-content {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-scroller">

        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo text-center">
                  <img 
                    src="C:\tushaldemo\src\pages\samples\Logo.png"
                    alt="Logo"
                  />
                </div>
                <h4>Auditorium Book</h4>

                <img 
                    src="Auditorium Book QR.png"
                    alt="Logo"
                  />
                
                  <center><a href="availability.html">Go to Auditorium Book </a></center>
              </div>
            </div>
          </div>
        </div>
        <!-- content-wrapper ends -->
      </div>
      <!-- page-body-wrapper ends -->
    </div>
    <!-- container-scroller -->


  </body>
</html>
