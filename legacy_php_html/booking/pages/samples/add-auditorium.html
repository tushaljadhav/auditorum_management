<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Add Auditorium Booking | Kirti M. Doongursee College of Arts, Science and Commerce</title>
    
    <!-- Include jQuery first -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Include Select2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" />

    <!-- Include other required CSS -->
    <link rel="stylesheet" href="../../assets/vendors/mdi/css/materialdesignicons.min.css" />
    <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="shortcut icon" href="../../assets/images/favicon.png" />

    <!-- Include Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      .brand-logo img {
        max-width: 100%;
        height: auto;
      }
      .auth-form-light h4 {
        margin-top: 20px;
        text-align: center;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-radius: 50%;
        border-top: 4px solid #3498db;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: none;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .faculty-details {
        margin-top: 10px;
        background-color: #f1f1f1;
        padding: 10px;
        border-radius: 5px;
      }
      .error-message {
        color: red;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-8 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo text-center">
                  <img src="C:/tushaldemo/src/pages/samples/Logo.png" alt="Logo" />
                </div>
                <h4>Book Auditorium</h4>
                <form id="auditoriumBookingForm" class="pt-3">
                  <div class="form-group">
                    <label for="eventNameInput">Event Name</label>
                    <input type="text" class="form-control form-control-lg" id="eventNameInput" placeholder="Enter Event Name" />
                    <div id="eventNameError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="departmentInput">Department</label>
                    <select class="form-control form-control-lg" id="departmentInput" onchange="loadFacultyOptions()">
                      <option value="">Select Department</option>
                      <option value="IT">IT</option>
                      <option value="CSE">CSE</option>
                      <option value="ECE">ECE</option>
                      <option value="Mechanical">Mechanical</option>
                    </select>
                    <div id="departmentError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="facultyNameInput">Faculty Name</label>
                    <select class="form-control form-control-lg" id="facultyNameInput" onchange="fetchFacultyDetails()">
                      <option value="">Select Faculty</option>
                    </select>
                    <div id="facultyNameError" class="error-message"></div>
                  </div>
                  <!-- Faculty Details -->
                  <div id="facultyDetails" class="faculty-details" style="display: none;">
                    <p><strong>Email:</strong> <span id="facultyEmail">rajesh.kumar@example.com</span></p>
                    <p><strong>Mobile:</strong> <span id="facultyMobile">+91 9876543210</span></p>
                  </div>
                  <div class="form-group">
                    <label for="venueInput">Venue (Hall)</label>
                    <select class="form-control form-control-lg" id="venueInput">
                      <option value="">Select Venue</option>
                      <option value="Hall A">Hall A</option>
                      <option value="Hall B">Hall B</option>
                      <option value="Hall C">Hall C</option>
                    </select>
                    <div id="venueError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="eventDescriptionInput">Event Description</label>
                    <textarea class="form-control form-control-lg" id="eventDescriptionInput" placeholder="Enter Event Description" rows="4"></textarea>
                    <div id="eventDescriptionError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="dateInput">Date</label>
                    <input type="date" class="form-control form-control-lg" id="dateInput" />
                    <div id="dateError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="startTimeInput">Start Time</label>
                    <input type="time" class="form-control form-control-lg" id="startTimeInput" />
                    <div id="startTimeError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="endTimeInput">End Time</label>
                    <input type="time" class="form-control form-control-lg" id="endTimeInput" />
                    <div id="endTimeError" class="error-message"></div>
                  </div>
                  <div class="form-group">
                    <label for="attendeesInput">Number of Attendees</label>
                    <input type="number" class="form-control form-control-lg" id="attendeesInput" placeholder="Enter number of attendees" />
                    <div id="attendeesError" class="error-message"></div>
                  </div>
                  <div class="mt-3 d-grid gap-2">
                    <button type="button" class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn" id="confirmBookingButton" onclick="confirmBooking()">
                      Confirm Booking
                      <span class="loader" id="loader"></span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      $(document).ready(function() {
        $('#facultyNameInput').select2();
        $('#venueInput').select2();
      });

      const facultyData = {
        IT: [
          { id: "faculty1", name: "Dr. Rajesh Kumar" },
          { id: "faculty2", name: "Prof. Vikram Singh" },
        ],
        CSE: [
          { id: "faculty3", name: "Dr. Neha Sharma" },
          { id: "faculty4", name: "Prof. Amit Yadav" },
        ],
        ECE: [
          { id: "faculty5", name: "Prof. Anil Kumar" },
          { id: "faculty6", name: "Dr. Priya Gupta" },
        ],
        Mechanical: [
          { id: "faculty7", name: "Prof. Radhika Joshi" },
          { id: "faculty8", name: "Dr. Kiran Patel" },
        ]
      };

      function loadFacultyOptions() {
        const department = $('#departmentInput').val();
        const facultySelect = $('#facultyNameInput');
        facultySelect.empty();
        if (department) {
          const faculties = facultyData[department] || [];
          faculties.forEach(faculty => {
            facultySelect.append(new Option(faculty.name, faculty.id));
          });
          $('#facultyNameInput').prop('disabled', false);
        } else {
          $('#facultyNameInput').prop('disabled', true);
        }
      }

      function fetchFacultyDetails() {
        const selectedFaculty = $('#facultyNameInput').val();
        let facultyEmail = '';
        let facultyMobile = '';

        if (selectedFaculty === 'faculty1') {
          facultyEmail = 'rajesh.kumar@example.com';
          facultyMobile = '+91 9876543210';
        } else if (selectedFaculty === 'faculty2') {
          facultyEmail = 'vikram.singh@example.com';
          facultyMobile = '+91 9876543211';
        }
        // Repeat for other faculties...

        $('#facultyEmail').text(facultyEmail);
        $('#facultyMobile').text(facultyMobile);
        $('#facultyDetails').show();
      }

      function confirmBooking() {
        let formValid = true;

        // Validate each field
        if (!$('#eventNameInput').val()) {
          $('#eventNameError').text('Event name is required');
          formValid = false;
        } else {
          $('#eventNameError').text('');
        }

        if (!$('#departmentInput').val()) {
          $('#departmentError').text('Please select a department');
          formValid = false;
        } else {
          $('#departmentError').text('');
        }

        if (!$('#facultyNameInput').val()) {
          $('#facultyNameError').text('Please select a faculty');
          formValid = false;
        } else {
          $('#facultyNameError').text('');
        }

        if (!$('#venueInput').val()) {
          $('#venueError').text('Please select a venue');
          formValid = false;
        } else {
          $('#venueError').text('');
        }

        if (!$('#eventDescriptionInput').val()) {
          $('#eventDescriptionError').text('Event description is required');
          formValid = false;
        } else {
          $('#eventDescriptionError').text('');
        }

        if (!$('#dateInput').val()) {
          $('#dateError').text('Please select a date');
          formValid = false;
        } else {
          $('#dateError').text('');
        }

        if (!$('#startTimeInput').val()) {
          $('#startTimeError').text('Please select a start time');
          formValid = false;
        } else {
          $('#startTimeError').text('');
        }

        if (!$('#endTimeInput').val()) {
          $('#endTimeError').text('Please select an end time');
          formValid = false;
        } else {
          $('#endTimeError').text('');
        }

        if (!$('#attendeesInput').val()) {
          $('#attendeesError').text('Please enter number of attendees');
          formValid = false;
        } else {
          $('#attendeesError').text('');
        }

        // If all fields are valid, redirect to the thank you page
        if (formValid) {
          window.location.href = 'thank-you.html';
        }
      }
    </script>
  </body>
</html>
